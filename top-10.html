<script type="module">
import { getFeatured } from './js/api.js';
import { gridCardHTML, skeletonGrid } from './js/utils.js';

const grid = document.getElementById('grid');
grid.innerHTML = skeletonGrid(10);

getFeatured({ limit:10 }).then(items => {
  if (!items?.length) {
    grid.innerHTML = `<div class="empty"><span class="empty-icon">🏆</span><div class="empty-h">لا توجد بيانات بعد</div></div>`;
    return;
  }
  grid.innerHTML = items.map(item => gridCardHTML(item)).join('');
}).catch(() => {
  grid.innerHTML = `<div class="empty"><span class="empty-icon">⚠️</span><div class="empty-h">تعذر التحميل</div></div>`;
});
