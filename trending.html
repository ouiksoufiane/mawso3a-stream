<script type="module">
import { getContent, countContent } from './js/api.js';
import { gridCardHTML, skeletonGrid } from './js/utils.js';

const PER = 30;
let page = 0;
let loading = false;

async function load() {
  if (loading) return;
  loading = true;
  const grid = document.getElementById('grid');
  grid.innerHTML = skeletonGrid(PER);
  window.scrollTo({ top:0, behavior:'smooth' });
  try {
    const [items, total] = await Promise.all([
      getContent({ order:'view_count.desc', limit:PER, offset:page*PER }),
      countContent({})
    ]);
    if (!items.length) {
      grid.innerHTML = `<div class="empty"><span class="empty-icon">🔥</span><div class="empty-h">لا يوجد محتوى</div></div>`;
    } else {
      grid.innerHTML = items.map(i => gridCardHTML(i)).join('');
    }
    renderPager(total);
  } catch {
    grid.innerHTML = `<div class="empty"><span class="empty-icon">⚠️</span><div class="empty-h">تعذر التحميل</div></div>`;
  } finally { loading = false; }
}

function renderPager(total) {
  const pages = Math.ceil(total / PER);
  const pg = document.getElementById('pager');
  if (pages <= 1) { pg.innerHTML = ''; return; }
  const s = Math.max(0, page-2), e = Math.min(pages-1, page+2);
  let h = page > 0 ? `<button class="pg-btn" data-p="${page-1}">‹ السابق</button>` : '';
  for (let i = s; i <= e; i++) h += `<button class="pg-btn ${i===page?'on':''}" data-p="${i}">${i+1}</button>`;
  if (page < pages-1) h += `<button class="pg-btn" data-p="${page+1}">التالي ›</button>`;
  pg.innerHTML = h;
  pg.querySelectorAll('.pg-btn').forEach(b => b.addEventListener('click', () => { page = +b.dataset.p; load(); }));
}

load();
</script>
