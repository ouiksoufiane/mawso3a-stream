<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>مشاهدة — الموسوعة ستريم</title>
<link rel="stylesheet" href="css/main.css"/>
</head>
<body>
<nav class="nav solid" id="nav">
  <a href="index.html" class="nav-logo">الموسوعة <em>ستريم</em></a>
  <div class="nav-links">
    <a href="javascript:history.back()" class="nav-link">← رجوع</a>
  </div>
  <div class="nav-right">
    <a href="search.html" class="nav-icon-btn keep" title="بحث">🔍</a>
  </div>
</nav>

<div class="watch-layout">
  <div class="watch-main">
    <div class="player-frame" id="playerFrame">
      <div style="display:flex;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--text-muted)">
        <div class="spinner"></div> جاري التحميل…
      </div>
    </div>

    <div class="player-info" id="playerInfo" style="display:none">
      <h1 class="player-title" id="pTitle"></h1>
      <div class="player-meta" id="pMeta"></div>
      <div class="player-actions" id="pActions"></div>
      <div id="pExtra"></div>
      <div class="player-nav" id="pNav"></div>
    </div>

    <!-- Related content -->
    <div class="section" id="relSection" style="display:none;padding-top:40px">
      <div class="sec-header">
        <div class="sec-title"><span class="sec-title-icon">🎬</span> محتوى مشابه</div>
        <div id="relCount" style="font-size:13px;color:var(--text-dim)"></div>
      </div>
      <div class="row-wrap">
        <button class="row-arrow right" onclick="scrollRow('relRow',-1)">›</button>
        <div class="row-scroll" id="relRow"></div>
        <button class="row-arrow left"  onclick="scrollRow('relRow',1)">‹</button>
      </div>
    </div>
  </div>

  <!-- Episode Sidebar (series only) -->
  <div class="watch-sidebar" id="sidebar" style="display:none">
    <div class="sidebar-header" id="sidebarTitle">قائمة الحلقات</div>
    <div id="sidebarEps"></div>
  </div>
</div>

<footer class="footer" style="margin-top:48px">
  <div class="footer-bottom" style="border-top:none;padding-top:0">
    <div class="footer-copy">© 2025 الموسوعة ستريم</div>
    <div class="footer-legal">
      <a href="index.html">الرئيسية</a>
      <a href="films.html">الأفلام</a>
      <a href="series.html">المسلسلات</a>
      <a href="legal.html#dmca">DMCA</a>
    </div>
  </div>
</footer>

<script type="module">
import { getContentById, getEpisodes, getContent, incrementView, reportDeadLink } from './js/api.js';
import { originBadge, langBadge, cardHTML, CW, FAV, toast, formatDuration, esc } from './js/utils.js';

window.scrollRow = function(id, dir) {
  const el = document.getElementById(id);
  if (el) el.scrollBy({ left: dir * 480, behavior: 'smooth' });
};

const sp = new URLSearchParams(location.search);
const filmId    = sp.get('id');
const episodeId = sp.get('episode');
const seriesId  = sp.get('series');

const SB_URL  = 'https://wadazxpofizrfoczhmkn.supabase.co/rest/v1';
const SB_ANON = 'sb_publishable_50j1Q_SJc1HA4fWXjO9jsA_wzsub0Az';

function embed(ytId) {
  const src = ytId.startsWith('arc_')
    ? `https://archive.org/embed/${esc(ytId.slice(4))}?autoplay=1`
    : `https://www.youtube.com/embed/${esc(ytId)}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
  document.getElementById('playerFrame').innerHTML =
    `<iframe src="${src}"
      allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" loading="eager"></iframe>`;
}

function showInfo() {
  document.getElementById('playerInfo').style.display = '';
}

function metaBadges(item) {
  const dur = item.duration_sec ? `<span class="badge" style="background:rgba(255,255,255,.05);color:var(--text-dim)">${formatDuration(item.duration_sec)}</span>` : '';
  const yr  = item.year ? `<span class="badge b-year">${item.year}</span>` : '';
  return `${originBadge(item.origin||'other')}${langBadge(item.language||'ar_dubbed')}${yr}${dur}`;
}

function reportBtn(id, ytId) {
  return `<button class="report-btn" onclick="window.__report('${esc(id)}','${esc(ytId)}')">⚠️ الإبلاغ عن رابط معطل</button>`;
}

window.__report = async function(id, ytId) {
  await reportDeadLink(id, ytId);
  toast('تم الإبلاغ. شكراً على مساعدتك! ✅', 'success');
};

function favBtn(id) {
  const on = FAV.is(id);
  return `<button class="btn btn-ghost btn-sm" id="favBtnMain" onclick="window.__toggleFavMain('${esc(id)}')" title="${on?'إزالة من المفضلة':'إضافة للمفضلة'}">
    ${on?'❤️ في المفضلة':'🤍 إضافة للمفضلة'}
  </button>`;
}
window.__toggleFavMain = function(id) {
  const on = FAV.toggle(id);
  const btn = document.getElementById('favBtnMain');
  if (btn) btn.innerHTML = on ? '❤️ في المفضلة' : '🤍 إضافة للمفضلة';
  toast(on ? '❤️ أضيف للمفضلة' : '🤍 أزيل من المفضلة', on ? 'success' : 'info');
};

async function loadFilm(id) {
  const film = await getContentById(id);
  if (!film) {
    document.getElementById('pTitle').textContent = 'الفيلم غير موجود';
    showInfo(); return;
  }

  document.title = `${film.title_ar} — الموسوعة ستريم`;
  embed(film.yt_id);
  showInfo();

  document.getElementById('pTitle').textContent = film.title_ar;
  document.getElementById('pMeta').innerHTML = metaBadges(film);
  document.getElementById('pActions').innerHTML = favBtn(film.id) + reportBtn(film.id, film.yt_id);

  if (film.description) {
    document.getElementById('pExtra').innerHTML = `<div class="player-desc">${esc(film.description)}</div>`;
  }

  // Save CW + increment view
  CW.save({ id: film.id, title: film.title_ar, href: `watch.html?id=${film.id}`, type:'film', progress:5 });
  incrementView(film.id);

  // Related films (same origin first, fallback to category)
  const [byOrigin, byCat] = await Promise.all([
    getContent({ type:'film', origin: film.origin, limit:12 }).catch(()=>[]),
    getContent({ type:'film', category: film.category, limit:12 }).catch(()=>[])
  ]);
  const seen = new Set([film.id]);
  const related = [...byOrigin, ...byCat].filter(r => { if (seen.has(r.id)) return false; seen.add(r.id); return true; }).slice(0, 12);
  if (related.length) {
    document.getElementById('relSection').style.display = '';
    document.getElementById('relCount').textContent = `${related.length} محتوى مشابه`;
    document.getElementById('relRow').innerHTML = related.map(i => cardHTML(i)).join('');
  }
}

async function loadEpisode(epId, serId) {
  const [epArr, series] = await Promise.all([
    fetch(`${SB_URL}/episodes?id=eq.${encodeURIComponent(epId)}&select=*`, {
      headers: { 'apikey': SB_ANON, 'Authorization': `Bearer ${SB_ANON}` }
    }).then(r => r.json()),
    serId ? getContentById(serId) : null
  ]);

  const ep = Array.isArray(epArr) ? epArr[0] : null;
  if (!ep) {
    document.getElementById('pTitle').textContent = 'الحلقة غير موجودة';
    showInfo(); return;
  }

  const epTitle = ep.title_ar || `الحلقة ${ep.episode}`;
  document.title = `${epTitle}${series ? ' — ' + series.title_ar : ''} — الموسوعة ستريم`;
  embed(ep.yt_id);
  showInfo();

  document.getElementById('pTitle').textContent = epTitle;
  document.getElementById('pMeta').innerHTML = `
    <span class="badge b-ser">الموسم ${ep.season||1} — الحلقة ${ep.episode||''}</span>
    ${ep.duration_sec ? `<span class="badge" style="background:rgba(255,255,255,.05);color:var(--text-dim)">${formatDuration(ep.duration_sec)}</span>` : ''}
    ${ep.source ? `<span class="badge b-ar">${esc(ep.source)}</span>` : ''}
  `;
  document.getElementById('pActions').innerHTML = reportBtn(ep.id || serId, ep.yt_id);

  if (ep.darija_desc) {
    document.getElementById('pExtra').innerHTML = `
      <div class="player-desc" style="border-right:3px solid #4ade80">
        <div style="color:#4ade80;font-size:12px;font-weight:800;margin-bottom:6px">🇲🇦 ملخص بالدارجة</div>
        ${esc(ep.darija_desc)}
      </div>`;
  }

  // Save CW
  if (series) {
    CW.save({
      id: series.id, title: series.title_ar,
      sub: `الموسم ${ep.season||1} — الحلقة ${ep.episode}`,
      href: `watch.html?episode=${epId}&series=${serId}`,
      type:'series', progress: 20
    });
    incrementView(series.id);
  }

  if (serId) {
    const eps = await getEpisodes(serId, ep.season);
    const idx = eps.findIndex(e => e.id === epId);

    // Sidebar
    document.getElementById('sidebar').style.display = '';
    if (series) document.getElementById('sidebarTitle').textContent = series.title_ar;
    document.getElementById('sidebarEps').innerHTML = eps.map((e, i) => {
      const isCur = e.id === epId;
      const url = `watch.html?episode=${encodeURIComponent(e.id)}&series=${encodeURIComponent(serId)}`;
      return `<a href="${url}" class="sidebar-ep ${isCur?'current':''}">
        <div class="sidebar-ep-num">${e.episode||i+1}</div>
        <div class="sidebar-ep-info">
          <div class="sidebar-ep-title">${esc(e.title_ar||'الحلقة '+(e.episode||i+1))}</div>
          <div class="sidebar-ep-meta">${e.duration_sec?formatDuration(e.duration_sec):''}</div>
        </div>
        ${isCur ? '<span style="color:var(--accent);font-size:11px;flex-shrink:0">▶ الآن</span>' : ''}
      </a>`;
    }).join('');

    setTimeout(() => {
      document.querySelector('.sidebar-ep.current')?.scrollIntoView({ block:'center', behavior:'smooth' });
    }, 400);

    // Prev / Next navigation
    let nav = '';
    if (series) nav += `<a href="series-detail.html?id=${encodeURIComponent(serId)}" class="btn btn-ghost btn-sm">📺 قائمة الحلقات</a>`;
    if (idx > 0) {
      const prev = eps[idx-1];
      nav = `<a href="watch.html?episode=${encodeURIComponent(prev.id)}&series=${encodeURIComponent(serId)}" class="btn btn-ghost btn-sm">‹ الحلقة ${prev.episode||idx}</a>` + nav;
    }
    if (idx < eps.length - 1) {
      const next = eps[idx+1];
      nav += `<a href="watch.html?episode=${encodeURIComponent(next.id)}&series=${encodeURIComponent(serId)}" class="btn btn-primary btn-sm">الحلقة ${next.episode||idx+2} ›</a>`;
    }
    document.getElementById('pNav').innerHTML = nav;
  }
}

if (filmId)        loadFilm(filmId);
else if (episodeId) loadEpisode(episodeId, seriesId);
else {
  document.getElementById('pTitle').textContent = 'لم يتم تحديد المحتوى';
  showInfo();
}
</script>
</body>
</html>
