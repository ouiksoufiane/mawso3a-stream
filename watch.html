<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>مشاهدة — الموسوعة ستريم</title>
<link rel="stylesheet" href="css/main.css"/>
</head>
<body>

<nav class="nav solid">
  <a href="index.html" class="nav-logo">الموسوعة <em>ستريم</em></a>
  <div class="nav-links">
    <a href="javascript:history.back()" class="nav-link">← رجوع</a>
    <a href="search.html" class="nav-link keep nav-search-btn" title="بحث">🔍</a>
  </div>
</nav>

<div class="watch-wrap">
  <div class="player-frame" id="playerFrame">
    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:14px">جاري التحميل…</div>
  </div>
  <div class="player-info">
    <div class="player-title" id="playerTitle">…</div>
    <div class="player-meta" id="playerMeta"></div>
    <div class="player-desc" id="playerDesc"></div>
    <div class="player-nav" id="playerNav"></div>
  </div>
</div>

<!-- Related -->
<div class="section" id="relatedSection" style="display:none">
  <div class="sec-header">
    <div class="sec-title">محتوى مشابه</div>
  </div>
  <div class="row-scroll" id="relatedRow"></div>
</div>

<footer class="footer" style="margin-top:40px">
  <div class="footer-logo">الموسوعة <em>ستريم</em></div>
</footer>

<script type="module">
import { getContentById, getEpisodes } from './js/api.js';

const SB_URL  = 'https://wadazxpofizrfoczhmkn.supabase.co/rest/v1';
const SB_ANON = 'sb_publishable_50j1Q_SJc1HA4fWXjO9jsA_wzsub0Az';

const sp = new URLSearchParams(location.search);
const filmId   = sp.get('id');
const episodeId = sp.get('episode');
const seriesId  = sp.get('series');

function embed(ytId) {
  document.getElementById('playerFrame').innerHTML =
    `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0" allowfullscreen allow="autoplay"></iframe>`;
}

function originBadge(o) {
  const m={turkish:'🇹🇷 تركي',indian:'🇮🇳 هندي',korean:'🇰🇷 كوري',moroccan:'🇲🇦 مغربي',american:'🇺🇸 أمريكي'};
  const c={turkish:'b-tr',indian:'b-in',korean:'b-ko',moroccan:'b-ma',american:'b-us'};
  return `<span class="badge ${c[o]||'b-ar'}">${m[o]||o}</span>`;
}

async function loadFilm(id) {
  const film = await getContentById(id);
  if (!film) { document.getElementById('playerTitle').textContent='فيلم غير موجود'; return; }
  document.title = `${film.title_ar} — الموسوعة ستريم`;
  embed(film.yt_id);
  document.getElementById('playerTitle').textContent = film.title_ar;
  document.getElementById('playerMeta').innerHTML = `
    ${originBadge(film.origin)}
    ${film.language==='darija'?'<span class="badge b-ar">🇲🇦 دارجة</span>':'<span class="badge b-ar">عربي مدبلج</span>'}
    ${film.year ? `<span class="badge b-dr">${film.year}</span>` : ''}
    ${film.duration_sec ? `<span class="badge" style="background:rgba(255,255,255,.06);color:var(--text-dim)">${Math.round(film.duration_sec/60)} دقيقة</span>` : ''}
  `;
  document.getElementById('playerDesc').textContent = film.description || '';
}

async function loadEpisode(epId, serId) {
  // Get episode from DB
  const res = await fetch(`${SB_URL}/episodes?id=eq.${encodeURIComponent(epId)}&select=*`, {
    headers: { 'apikey': SB_ANON, 'Authorization': `Bearer ${SB_ANON}` }
  });
  const arr = await res.json();
  const ep = arr[0];
  if (!ep) { document.getElementById('playerTitle').textContent='حلقة غير موجودة'; return; }

  embed(ep.yt_id);
  document.title = `${ep.title_ar||'حلقة'} — الموسوعة ستريم`;
  document.getElementById('playerTitle').textContent = ep.title_ar || `الحلقة ${ep.episode}`;
  document.getElementById('playerMeta').innerHTML = `
    <span class="badge b-ser">الموسم ${ep.season||1} — الحلقة ${ep.episode}</span>
    ${ep.darija_desc ? '<span class="badge b-ma">🇲🇦 دارجة</span>' : ''}
    ${ep.source ? `<span class="badge b-ar">${ep.source}</span>` : ''}
    ${ep.duration_sec ? `<span class="badge" style="background:rgba(255,255,255,.06);color:var(--text-dim)">${Math.round(ep.duration_sec/60)} دقيقة</span>` : ''}
  `;
  if (ep.darija_desc) {
    document.getElementById('playerDesc').innerHTML = `
      <div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:var(--radius-sm);padding:14px 16px;margin-top:8px">
        <div style="color:#4ade80;font-size:12px;font-weight:700;margin-bottom:6px">🇲🇦 ملخص بالدارجة</div>
        <div style="font-size:14px;line-height:1.75;color:var(--text-dim)">${ep.darija_desc}</div>
      </div>`;
  }

  // Prev / Next navigation
  if (serId) {
    const eps = await getEpisodes(serId, ep.season);
    const idx = eps.findIndex(e=>e.id===epId);
    const nav = document.getElementById('playerNav');
    let navHtml = `<a href="series-detail.html?id=${encodeURIComponent(serId)}" class="btn btn-ghost">📺 قائمة الحلقات</a>`;
    if (idx > 0) navHtml = `<a href="watch.html?episode=${encodeURIComponent(eps[idx-1].id)}&series=${encodeURIComponent(serId)}" class="btn btn-ghost">‹ السابقة</a>` + navHtml;
    if (idx < eps.length-1) navHtml += `<a href="watch.html?episode=${encodeURIComponent(eps[idx+1].id)}&series=${encodeURIComponent(serId)}" class="btn btn-primary">التالية ›</a>`;
    nav.innerHTML = navHtml;
  }
}

if (filmId)    loadFilm(filmId);
else if (episodeId) loadEpisode(episodeId, seriesId);
else document.getElementById('playerTitle').textContent = 'لم يتم تحديد المحتوى';
</script>
</body>
</html>
