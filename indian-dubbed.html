<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#080810"/>
<link rel="stylesheet" href="css/main.css"/>
</head>
<body>

<nav class="nav solid">
  <a href="index.html" class="nav-logo">الموسوعة <em>ستريم</em></a>
  <div class="nav-links">
    <a href="index.html"  class="nav-link">الرئيسية</a>
    <a href="series.html" class="nav-link">المسلسلات</a>
    <a href="films.html"  class="nav-link">الأفلام</a>
  </div>
  <div class="nav-right"><a href="search.html" class="nav-icon-btn" title="بحث">🔍</a></div>
</nav>

<div class="cat-hero">
  <span class="cat-hero-icon">🇮🇳</span>
  <h1 class="cat-hero-title">هندي مدبلج</h1>
  <p class="cat-hero-sub">بوليوود وأفلام هندية مدبلجة بالعربية — دراما، رومانسي، أكشن</p>
</div>

<div class="filters-wrap" style="top:var(--nav-h)">
  <div class="filter-group">
    <span class="filter-label">النوع</span>
    <button class="filter-btn on" data-k="type" data-v="">الكل</button>
    <button class="filter-btn" data-k="type" data-v="film">🎬 أفلام</button>
    <button class="filter-btn" data-k="type" data-v="series">📺 مسلسلات</button>
  </div>
</div>

<div class="content-grid" id="grid"></div>
<div class="pagination" id="pager"></div>

<nav class="mob-nav">
  <div class="mob-nav-inner">
    <a href="index.html"  class="mob-nav-item"><span class="mob-nav-icon">⌂</span><span class="mob-nav-label">الرئيسية</span></a>
    <a href="films.html"  class="mob-nav-item"><span class="mob-nav-icon">🎬</span><span class="mob-nav-label">أفلام</span></a>
    <a href="search.html" class="mob-nav-item"><span class="mob-nav-icon">🔍</span><span class="mob-nav-label">بحث</span></a>
    <a href="series.html" class="mob-nav-item"><span class="mob-nav-icon">📺</span><span class="mob-nav-label">مسلسلات</span></a>
    <a href="my-list.html" class="mob-nav-item"><span class="mob-nav-icon">♥</span><span class="mob-nav-label">قائمتي</span></a>
  </div>
</nav>

<footer class="footer"><div class="footer-bottom"><div class="footer-copy">© 2025 الموسوعة ستريم</div><div class="footer-legal"><a href="index.html">الرئيسية</a><a href="legal.html#dmca">DMCA</a></div></div></footer>

<script type="module">
import { getContent, countContent } from './js/api.js';
import { gridCardHTML, skeletonGrid } from './js/utils.js';
const PER = 30; let typeFilter = ''; let page = 0; let loading = false;
document.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll(`.filter-btn[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); typeFilter = b.dataset.v; page = 0; load();
}));
async function load() {
  if (loading) return; loading = true;
  const grid = document.getElementById('grid');
  grid.innerHTML = skeletonGrid(PER); window.scrollTo({ top:0, behavior:'smooth' });
  try {
    const params = { origin:'indian', order:'view_count.desc', limit:PER, offset:page*PER };
    const cParams = { origin:'indian' };
    if (typeFilter) { params.type = typeFilter; cParams.type = typeFilter; }
    const [items, total] = await Promise.all([getContent(params), countContent(cParams)]);
    grid.innerHTML = items.length ? items.map(i => gridCardHTML(i)).join('') : `<div class="empty"><span class="empty-icon">🇮🇳</span><div class="empty-h">لا يوجد محتوى</div></div>`;
    renderPager(total);
  } catch { grid.innerHTML = `<div class="empty"><span class="empty-icon">⚠️</span><div class="empty-h">تعذر التحميل</div></div>`; }
  finally { loading = false; }
}
function renderPager(total) {
  const pages = Math.ceil(total/PER); const pg = document.getElementById('pager');
  if (pages<=1) { pg.innerHTML=''; return; }
  let h = page>0 ? `<button class="pg-btn" data-p="${page-1}">‹ السابق</button>` : '';
  const s=Math.max(0,page-2), e=Math.min(pages-1,page+2);
  for(let i=s;i<=e;i++) h+=`<button class="pg-btn ${i===page?'on':''}" data-p="${i}">${i+1}</button>`;
  if(page<pages-1) h+=`<button class="pg-btn" data-p="${page+1}">التالي ›</button>`;
  pg.innerHTML=h; pg.querySelectorAll('.pg-btn').forEach(b=>b.addEventListener('click',()=>{page=+b.dataset.p;load();}));
}
load();
</script>
</body>
</html>
