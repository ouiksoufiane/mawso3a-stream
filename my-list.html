<script type="module">
import { getContentById } from './js/api.js';
import { gridCardHTML, FAV, toast } from './js/utils.js';

const grid = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');

async function load() {
  const ids = FAV.getIds();
  if (!ids.length) {
    emptyState.style.display = '';
    return;
  }

  // Load all favs in parallel (batches of 10 to avoid overloading)
  const results = await Promise.all(ids.map(id => getContentById(id).catch(() => null)));
  const items = results.filter(Boolean);

  if (!items.length) {
    emptyState.style.display = '';
    return;
  }

  grid.innerHTML = items.map(item => gridCardHTML(item)).join('');
}

load();
</script>
