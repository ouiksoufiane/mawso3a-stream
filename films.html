<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>الأفلام — الموسوعة ستريم</title>
<link rel="stylesheet" href="css/main.css"/>
</head>
<body>
<nav class="nav solid">
  <a href="index.html" class="nav-logo">الموسوعة <em>ستريم</em></a>
  <div class="nav-links">
    <a href="index.html"  class="nav-link">الرئيسية</a>
    <a href="series.html" class="nav-link">المسلسلات</a>
    <a href="films.html"  class="nav-link active">الأفلام</a>
  </div>
  <div class="nav-right"><a href="search.html" class="nav-icon-btn keep">🔍</a></div>
</nav>

<div class="page-hero">
  <div class="page-title">🎬 الأفلام</div>
  <div class="page-sub" id="pageCount">جاري التحميل…</div>
</div>

<div class="filters-wrap">
  <div class="filter-group">
    <span class="filter-label">الأصل</span>
    <button class="filter-btn on" data-k="origin" data-v="">الكل</button>
    <button class="filter-btn" data-k="origin" data-v="turkish">🇹🇷 تركي</button>
    <button class="filter-btn" data-k="origin" data-v="indian">🇮🇳 هندي</button>
    <button class="filter-btn" data-k="origin" data-v="korean">🇰🇷 كوري</button>
    <button class="filter-btn" data-k="origin" data-v="american">🇺🇸 أمريكي</button>
    <button class="filter-btn" data-k="origin" data-v="moroccan">🇲🇦 مغربي</button>
  </div>
  <div class="filter-group">
    <span class="filter-label">اللغة</span>
    <button class="filter-btn on" data-k="language" data-v="">الكل</button>
    <button class="filter-btn" data-k="language" data-v="ar_dubbed">عربي مدبلج</button>
    <button class="filter-btn" data-k="language" data-v="darija">🇲🇦 دارجة</button>
    <button class="filter-btn" data-k="language" data-v="fr_dubbed">🇫🇷 فرنسي</button>
  </div>
  <div class="filter-group">
    <span class="filter-label">التصنيف</span>
    <button class="filter-btn on" data-k="category" data-v="">الكل</button>
    <button class="filter-btn" data-k="category" data-v="drama">دراما</button>
    <button class="filter-btn" data-k="category" data-v="action">أكشن</button>
    <button class="filter-btn" data-k="category" data-v="comedy">كوميدي</button>
    <button class="filter-btn" data-k="category" data-v="horror">رعب</button>
    <button class="filter-btn" data-k="category" data-v="romance">رومانسي</button>
  </div>
  <select class="sort-select" id="sortSel">
    <option value="created_at.desc">الأحدث إضافةً</option>
    <option value="view_count.desc">الأكثر مشاهدةً</option>
    <option value="year.desc">الأحدث إنتاجاً</option>
    <option value="title_ar.asc">أبجدي</option>
  </select>
</div>

<div class="content-grid" id="grid"></div>
<div class="pagination" id="pager"></div>

<footer class="footer">
  <div class="footer-logo">الموسوعة <em>ستريم</em></div>
</footer>

<script type="module">
import { getContent, countContent } from './js/api.js';
import { gridCardHTML, skeletonGrid } from './js/utils.js';

const PER = 30;
let S = { origin:'', language:'', category:'', order:'created_at.desc', page:0 };

const sp = new URLSearchParams(location.search);
['origin','language','category'].forEach(k => { if (sp.get(k)) S[k] = sp.get(k); });

function sync() {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('on', b.dataset.v === S[b.dataset.k]));
}
document.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', () => { S[b.dataset.k] = b.dataset.v; S.page=0; sync(); load(); }));
document.getElementById('sortSel').addEventListener('change', e => { S.order = e.target.value; S.page=0; load(); });

async function load() {
  document.getElementById('grid').innerHTML = skeletonGrid(30);
  const params = { type:'film', limit:PER, offset:S.page*PER, order:S.order };
  if (S.origin)   params.origin   = S.origin;
  if (S.language) params.language = S.language;
  if (S.category) params.category = S.category;
  const [items, total] = await Promise.all([getContent(params), countContent({type:'film',...(S.origin&&{origin:S.origin}), ...(S.language&&{language:S.language}), ...(S.category&&{category:S.category})})]);
  document.getElementById('pageCount').textContent = `${total.toLocaleString('ar')} فيلم`;
  if (!items.length) {
    document.getElementById('grid').innerHTML = `<div class="empty"><div class="empty-icon">🎬</div><div class="empty-h">لا توجد نتائج</div><div class="empty-p">جرب تصفية أخرى أو انتظر الإضافة التلقائية</div></div>`;
  } else {
    document.getElementById('grid').innerHTML = items.map(gridCardHTML).join('');
  }
  // Pager
  const pages = Math.ceil(total/PER);
  const pg = document.getElementById('pager');
  if (pages<=1){pg.innerHTML='';return;}
  const s=Math.max(0,S.page-2), e=Math.min(pages-1,S.page+2);
  let h = S.page>0?`<button class="pg-btn" data-p="${S.page-1}">‹ السابق</button>`:'';
  for(let i=s;i<=e;i++) h+=`<button class="pg-btn ${i===S.page?'on':''}" data-p="${i}">${i+1}</button>`;
  if(S.page<pages-1) h+=`<button class="pg-btn" data-p="${S.page+1}">التالي ›</button>`;
  pg.innerHTML=h;
  pg.querySelectorAll('.pg-btn').forEach(b=>b.addEventListener('click',()=>{S.page=+b.dataset.p;load();window.scrollTo({top:0,behavior:'smooth'});}));
}

sync(); load();
</script>
</body>
</html>
